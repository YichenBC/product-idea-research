[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "product-idea-research"
version = "0.3.1"
description = "Composable, evidence-backed research workflows for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Product Idea Research contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
product-idea-research = "product_idea_research.cli:main"
research-workbench = "product_idea_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["product_idea_research*", "research_workbench"]

[tool.setuptools.package-data]
product_idea_research = ["skill/*", "skill/**/*"]
