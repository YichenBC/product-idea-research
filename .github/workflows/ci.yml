name: test-and-build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps --no-index --find-links dist product-idea-research
      - run: product-idea-research install --target codex --scope project --directory "${{ runner.temp }}/skill-smoke"
      - run: product-idea-research install --target claude --scope project --directory "${{ runner.temp }}/skill-smoke"
      - run: research-workbench --version
      - run: python -m research_workbench --version
